<div class="content">
    <h2>Campaigns</h2>
    <main>
        <section class="campaign-search">
            <div class="search-bar">
                <label for="search">Search:</label>
                <input #searchInput placeholder="Search campaigns" (input)="filterCampaigns(
                    searchInput.value)">
            </div>
            <button>Create Campaign</button>
        </section>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Created</th>
                    <th>Last Modified</th>
                </tr>
            </thead>
            <tbody>
                @for(campaign of campaignData; track campaign.id) {
                <tr>
                    <td>{{campaign.id}}</td>
                    <td>{{campaign.title}}</td>
                    <td>{{campaign.creationDate}}</td>
                    <td>{{campaign.lastModifiedDate}}</td>
                </tr>
                }
            </tbody>
        </table>
    </main>
</div>
